name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - adapter-pose-route-distance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r requirements.txt
      - name: Offline pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest \
            omnisim_seam/test_omnisim_seam.py \
            omnisim_seam/test_omnisim_narrow.py \
            omnisim_seam/test_route_geometry.py \
            omnisim_seam/test_geometry_attribution.py \
            omnisim_seam/test_control_plane.py \
            test_memoryboard_adapter.py \
            test_swarm_law.py
